map $http_origin $hls_cors_origin {
    default "";
    "http://localhost:5173"     $http_origin;
    "${FRONT_REDIRECT_ORIGIN}"  $http_origin;
}

server {
    listen 80;
    server_name ${SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /api/internal {
        return 403;
    }
    location ^~ /api/ws/ {
        proxy_pass http://spring:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /api {
        proxy_pass http://spring:8080;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location /oauth {
        proxy_pass http://spring:8080;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location /oauth2 {
        proxy_pass http://spring:8080;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location ~ ^/rtc/(?<mtxpath>.+)$ {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://mediamtx:8889/$mtxpath$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/hls/(?<mtxpath>.+)$ {
        resolver 127.0.0.11 valid=10s;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $hls_cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Range" always;
            add_header Access-Control-Max-Age 3600 always;
            return 204;
        }
        proxy_pass http://mediamtx:8888/$mtxpath$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect ~^http://[^/]+/(.*)$ /hls/$1;
        proxy_redirect ~^/(.*)$ /hls/$1;

        # MediaMTX의 '*' CORS 헤더를 비활성화, credentials 호환 헤더로 변경
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $hls_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        # localhost:5173 -> API 도메인은 크로스 사이트라 쿠키에 SameSite=None Secure 필요
        proxy_cookie_flags ~ secure samesite=none;
    }

    location / {
        return 200 'bscene server is running (https)\n';
        add_header Content-Type text/plain;
    }
}