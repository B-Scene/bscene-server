server:
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev

  mvc:
    async:
      request-timeout:

  application:
    name: bscene
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL JDBC
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_REST_API_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI}
            scope:
              - profile_nickname
              - account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope:
              - email
              - profile
        provider:
          kakao:
            authorization-uri: "https://kauth.kakao.com/oauth/authorize"
            token-uri: "https://kauth.kakao.com/oauth/token"
            user-info-uri: "https://kapi.kakao.com/v2/user/me"
            userNameAttribute: id

  # IO Burst, 스레드풀 고갈 대비 virtual thread 활성화
  threads:
    virtual:
      enabled: true

  # discord webhook
  http:
    serviceclient:
      discord:
        base-url: ${DISCORD_WEBHOOK_URL}

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY}
    expiration:
      access: 3600000 # 1시간
      refresh: 1209600000 # 14일
      signup: 600000 # 10분 (소셜 신규 유저 임시 토큰)

# RTMP + LL-HLS
mediamtx:
  hls-url: ${MEDIAMTX_HLS_URL:http://localhost:8888}
  api-url: ${MEDIAMTX_API_URL:http://localhost:9997}
  webrtc-url: ${MEDIAMTX_WEBRTC_URL:http://localhost:8889}
  # 내부 믹서(GStreamer) 인증용 정적 토큰. 미설정 시 믹서 인증 비활성화 (mixer 컨테이너의 MIXER_TOKEN과 동일 값이어야 함)
  mixer-token: ${MEDIAMTX_MIXER_TOKEN:}

# FRONT_ORIGIN : CORS 허용 목록 (콤마로 여러 개 가능)
# FRONT_REDIRECT_ORIGIN : 소셜 로그인 리다이렉트용 단일 프론트 주소 (경로 제외 origin만)
# 두 용도를 한 변수로 겸용하면 CORS용 목록 값이 리다이렉트 URL에 섞여 500(Bad authority)이 발생 → 분리
cors:
  allowed-origins: ${FRONT_ORIGIN:http://localhost:5173}

oauth:
  # 기본값은 배포 프론트 — 로컬 프론트/백엔드 개발 시에는 로그인 시작 URL에 ?redirect_origin=http://localhost:5173을 붙여 사용
  front-redirect-uri: ${FRONT_REDIRECT_ORIGIN:https://bscene.app}/oauth/callback
  front-failure-uri: ${FRONT_REDIRECT_ORIGIN:https://bscene.app}/login

  # 모바일 SDK 로그인: 앱이 받은 제공자 토큰을 서버가 검증할 때 쓰는 값 (명세 SDK v0.3)
  # 비어 있으면 해당 제공자 검증은 실패한다. 값은 GitHub Secret ENV_FILE 로 주입
  mobile:
    kakao:
      app-id: ${KAKAO_APP_ID:}                       # 카카오 콘솔 앱 ID(숫자). access_token_info.app_id 와 비교
    google:
      allowed-audiences: ${GOOGLE_MOBILE_CLIENT_IDS:} # 콤마 구분 client ID 목록. ID Token aud 허용 목록
    apple:
      client-id: ${APPLE_BUNDLE_ID:}                 # iOS 번들 ID. identityToken aud 와 비교
      team-id: ${APPLE_TEAM_ID:}                     # 인가 코드 교환용 client secret 서명 (Apple Developer Team ID)
      key-id: ${APPLE_KEY_ID:}                       # Sign in with Apple 키 ID
      private-key-path: ${APPLE_PRIVATE_KEY_PATH:}   # .p8 비밀키 파일 경로. 배포 시 컨테이너에 파일 마운트 필요
    # IP당 분당 호출 제한. 초과 시 OAUTH429_1 + Retry-After 헤더 (명세 SDK v0.2)
    rate-limit:
      login-per-minute: 30                           # /mobile/kakao, /google, /apple 합산
      challenge-per-minute: 10                       # /mobile/apple/challenge

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

notification:
  fcm:
    enabled: ${FCM_ENABLED:false}
    credentials-base64: ${FCM_CREDENTIALS_BASE64:}

# discord 밴드 생성 검수 봇 (토큰 미설정 시 봇 비활성화)
discord:
  bot:
    token: ${DISCORD_BOT_TOKEN:}
    verify-channel-id: ${DISCORD_VERIFY_CHANNEL_ID:}

# spring actuator
management:
  server:
    # 서비스 포트와 분리
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
