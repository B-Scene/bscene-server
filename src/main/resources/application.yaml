server:
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev

  mvc:
    async:
      request-timeout:

  application:
    name: bscene
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL JDBC
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_REST_API_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI}
            scope:
              - profile_nickname
              - account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope:
              - email
              - profile
        provider:
          kakao:
            authorization-uri: "https://kauth.kakao.com/oauth/authorize"
            token-uri: "https://kauth.kakao.com/oauth/token"
            user-info-uri: "https://kapi.kakao.com/v2/user/me"
            userNameAttribute: id

  # IO Burst, 스레드풀 고갈 대비 virtual thread 활성화
  threads:
    virtual:
      enabled: true

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY}
    expiration:
      access: 3600000 # 1시간
      refresh: 1209600000 # 14일
      signup: 600000 # 10분 (소셜 신규 유저 임시 토큰)

# RTMP + LL-HLS
mediamtx:
  hls-url: ${MEDIAMTX_HLS_URL:http://localhost:8888}
  api-url: ${MEDIAMTX_API_URL:http://localhost:9997}
  webrtc-url: ${MEDIAMTX_WEBRTC_URL:http://localhost:8889}

cors:
  allowed-origins: ${FRONT_ORIGIN:http://localhost:5173}

oauth:
  front-redirect-uri: ${FRONT_ORIGIN:http://localhost:5173}/oauth/callback
  front-failure-uri: ${FRONT_ORIGIN:http://localhost:5173}/login

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

notification:
  fcm:
    enabled: ${FCM_ENABLED:false}
    credentials-base64: ${FCM_CREDENTIALS_BASE64:}
  terms:
    live-id: ${NOTIFICATION_TERMS_LIVE_ID:4}

# discord
discord:
  name: discord-feign-client
  webhook-url: ${DISCORD_WEBHOOK_URL}