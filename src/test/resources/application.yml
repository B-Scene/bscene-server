# src/test/resources/application.yml
spring:
  application:
    name: bscene
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-only

jwt:
  token:
    secretKey: testtesttesttesttesttesttesttest123456
    expiration:
      access: 3600000
      refresh: 1209600000

aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    access-key: test-access-key
    secret-key: test-secret-key
