services:

  spring:
    image: ${BACKEND_IMAGE}
    container_name: spring
    restart: always
    env_file: ./.env
    expose:
      - "8080"
    depends_on:
      - redis
    networks:
      - bscene

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "192mb"
      - "--maxmemory-policy"
      - "volatile-ttl"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - bscene

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SERVER_NAME=${SERVER_NAME}
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - spring
    networks:
      - bscene
    command: >
      /bin/sh -c "envsubst '$${SERVER_NAME}'
      < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf
      && (while :; do sleep 6h & wait $${!}; nginx -s reload; done&)
      && exec nginx -g 'daemon off;'"

  mediamtx:
    image: bluenviron/mediamtx:1.19.2
    container_name: mediamtx
    restart: always
    env_file: ./.env
    environment:
      - MTX_RTSPTRANSPORTS=tcp
    ports:
      - "8554:8554"
    expose:
      - "8888"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - bscene

networks:
  bscene:
    driver: bridge

volumes:
  redis-data:
