services:

  spring:
    image: ${BACKEND_IMAGE}
    container_name: spring
    restart: always
    env_file: ./.env
    environment:
      - TZ=Asia/Seoul  # 로그·S3 key 타임스탬프를 KST로 통일
    expose:
      - "8080"
    volumes:
      - recordings:/recordings  # mediamtx 녹화본 S3 업로드용 공유 볼륨
    depends_on:
      - redis
    networks:
      - bscene

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: always
    environment:
      - TZ=Asia/Seoul
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "192mb"
      - "--maxmemory-policy"
      - "volatile-ttl"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - bscene

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Seoul
      - SERVER_NAME=${SERVER_NAME}
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - spring
      - mediamtx
    networks:
      - bscene
    command: >
      /bin/sh -c "envsubst '$${SERVER_NAME}'
      < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf
      && (while :; do sleep 6h & wait $${!}; nginx -s reload; done&)
      && exec nginx -g 'daemon off;'"

  mediamtx:
    image: bluenviron/mediamtx:1.19.2-ffmpeg  # runOnRecordSegmentComplete 훅 실행에 쉘 필요 (기본 이미지는 scratch 기반)
    container_name: mediamtx
    restart: always
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=${SERVER_HOST}
      - TZ=Asia/Seoul
    ports:
      - "8189:8189/udp"
      - "8889"
      - "8888"  # nginx HLS proxy
    expose:
      - "8889"  # nginx 접근
      - "9997"  # spring 접근
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - bscene

networks:
  bscene:
    driver: bridge

volumes:
  redis-data:
  recordings:
